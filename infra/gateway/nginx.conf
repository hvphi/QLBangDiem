events { worker_connections 1024; }

http {
  server_tokens off;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  log_format safe '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent request_id=$request_id';
  access_log /var/log/nginx/access.log safe;

  upstream portal { server frontend:3000; keepalive 24; }
  upstream core_api { server core:8080; keepalive 24; }

  server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /internal/ { return 404; }
    location ^~ /oauth2/ {
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /login/oauth2/ {
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location = /logout {
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/submissions {
      limit_req zone=api burst=40 nodelay;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Correlation-ID $request_id;
    }
    location ^~ /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://core_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Correlation-ID $request_id;
    }
    location / {
      proxy_pass http://portal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
