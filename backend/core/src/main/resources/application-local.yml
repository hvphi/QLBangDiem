server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:h2:file:./.local/data/qlbangdiem;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
app:
  auth:
    demo-mode: true
  storage:
    mode: local
    root: ./.local/storage
  verification:
    service-token: ${VERIFICATION_SERVICE_TOKEN:local-stage-only}
